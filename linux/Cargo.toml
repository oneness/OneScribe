[package]
name = "onescribe-linux-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "onescribe_linux_core"
path = "src/lib.rs"

[dependencies]
ashpd = "0.12.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
ksni = "0.3.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt", "signal", "time"] }
# Local speech-to-text (ggml). default-features = false drops the `metal`
# default, which is wrong off Apple platforms; the CPU path is used on Linux.
transcribe-cpp = { version = "0.1.3", default-features = false }
